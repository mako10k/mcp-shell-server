<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP Shell Backoffice</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>MCP Shell Backoffice</h1>
      <nav>
        <button data-tab="history" class="active">履歴</button>
        <button data-tab="executions">実行</button>
        <button data-tab="terminals">ターミナル</button>
      </nav>
      <div class="header-controls">
        <label><input type="checkbox" id="auto-refresh" /> 自動更新</label>
      </div>
    </header>

    <main>
      <section id="history" class="tab active">
        <div class="controls">
          <input id="history-q" placeholder="コマンド検索" />
          <input id="history-from" type="datetime-local" title="開始" />
          <input id="history-to" type="datetime-local" title="終了" />
          <select id="history-executed" title="実行有無">
            <option value="">executed: any</option>
            <option value="true">executed: true</option>
            <option value="false">executed: false</option>
          </select>
          <select id="history-safety" title="安全分類">
            <option value="">safety: any</option>
            <option value="basic_safe">basic_safe</option>
            <option value="llm_required">llm_required</option>
          </select>
          <label>page size
            <select id="history-page-size">
              <option>10</option>
              <option selected>20</option>
              <option>50</option>
              <option>100</option>
            </select>
          </label>
          <button id="history-refresh">更新</button>
          <div class="pager">
            <button id="history-prev">◀</button>
            <span id="history-page-info">1 / 1</span>
            <button id="history-next">▶</button>
          </div>
        </div>
        <table id="history-table">
          <thead>
            <tr>
              <th>時刻</th>
              <th>コマンド</th>
              <th>要約</th>
              <th>WD</th>
              <th>分類</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section id="executions" class="tab">
        <div class="controls">
          <input id="exec-q" placeholder="コマンド検索" />
          <select id="exec-status">
            <option value="all">all</option>
            <option value="running">running</option>
            <option value="completed">completed</option>
            <option value="failed">failed</option>
            <option value="timeout">timeout</option>
          </select>
          <button id="exec-refresh">更新</button>
        </div>
        <table id="exec-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>コマンド</th>
              <th>状態</th>
              <th>時間</th>
              <th>出力ID</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section id="terminals" class="tab">
        <div class="controls">
          <select id="term-status">
            <option value="all">all</option>
            <option value="active">active</option>
            <option value="idle">idle</option>
            <option value="closed">closed</option>
          </select>
          <button id="term-refresh">更新</button>
        </div>
        <table id="term-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>セッション</th>
              <th>状態</th>
              <th>最終活動</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <footer>
      <small>Local only. No authentication. For development use.</small>
    </footer>

    <script src="/main.js"></script>
  </body>
</html>
        <div id="history-detail" class="detail-panel" hidden>
          <div class="detail-actions">
            <button id="history-copy-cmd">コマンドをコピー</button>
            <button id="history-close-detail">閉じる</button>
          </div>
          <pre id="history-detail-pre"></pre>
        </div>
        <div id="exec-detail" class="detail-panel" hidden>
          <div class="detail-actions">
            <button id="exec-close-detail">閉じる</button>
          </div>
          <pre id="exec-detail-pre"></pre>
          <h4>出力ファイル</h4>
          <ul id="exec-outputs"></ul>
        </div>
        <div id="term-output-panel" class="detail-panel" hidden>
          <div class="detail-actions">
            <label><input type="checkbox" id="term-autorefresh" /> 自動更新</label>
            <button id="term-output-refresh">出力更新</button>
            <button id="term-output-close">閉じる</button>
          </div>
          <pre id="term-output-pre" class="terminal"></pre>
        </div>
